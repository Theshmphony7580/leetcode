name: Sync LeetCode

on:
  workflow_dispatch:      # Lets you test and run it manually anytime
  schedule:
    - cron: '0 8 * * *'   # Automatically runs every single day at 8:00 AM UTC

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Sync LeetCode Problems
        uses: joshcai/leetcode-sync@v1.7.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: problems
          verbose: true
