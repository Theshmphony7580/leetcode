name: Sync LeetCode (India Time)

on:
  workflow_dispatch:      # Lets you run it manually anytime
  schedule:
    - cron: '30 0 * * *'  # Runs every day at 12:30 AM UTC (6:00 AM IST)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Sync LeetCode Problems
        uses: joshcai/leetcode-sync@v1.7  # Fixed the version tag here
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: problems
          verbose: true
